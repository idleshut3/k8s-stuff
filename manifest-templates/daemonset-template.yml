# Template for kubernetes daemonsets
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: 
  namespace: 
  labels:
    k8s-app: 
spec:
  selector:
    matchLabels:
      name: 
  template:
    metadata:
      labels:
        name: 
    spec:
      tolerations:
      # these tolerations are to have the daemonset runnable on control plane nodes
      # remove them if your control plane nodes should not run pods
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: 
          image: 
          resources:
            limits:
              memory: # Ex: 200Mi
            requests:
              cpu: # Ex: 100m
              memory: # Ex: 200Mi
        volumeMounts:
          - name: # Ex: varlog
            mountPath: # Ex: /var/log
      # it may be desirable to set a high priority class to ensure that a DaemonSet Pod
      # preempts running Pods
      # priorityClassName: important
      terminationGracePeriodSeconds: 
      volumes:
        - name: varlog
          hostPath:
            path: /var/log

