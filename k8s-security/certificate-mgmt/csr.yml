# This is an example of a CSR definition file in k8s. Need to do more research into this.
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: user01
spec:
  groups:
  - system:authenticated
  # You can generate the base64 with `cat file.csr | base64 -w 0`
  request: <base64 encoded value of the CSR file>
  signerName: kubernetes.io/kube-apiserver-client
  usages:
  - client auth
