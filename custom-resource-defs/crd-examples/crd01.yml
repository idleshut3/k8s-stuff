# Basic example of a CustomResourceDefinition. Note that CRDs may require custom controllers/operators.
# For a comprehensive overview, see https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: pickles.stable.example.com
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: stable.example.com
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1
      # Each version can be enabled/disabled by Served flag.
      served: true
      # One and only one version must be marked as the storage version.
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              # Here we define the spec which will be used in our manifests when creating an object based on the CRD
              # Note that you can perform validation, set defaults, and a bunch of other things here. See the docs for more info
              properties:
                pickleType:
                  type: string
                isOrganic:
                  type: boolean
                count:
                  type: integer
      
      # Here we can define fields to filter output with kubectl
      # For example: kubectl get pickles.stable.example.com --field-selector spec.pickleType=dill
      selectableFields:
        - jsonPath: .spec.pickleType
        - jsonPath: .spec.isOrganic

      # Here we can define columns shown by the kubectl get command
      additionalPrinterColumns:
        - name: Type
          type: string
          description: The variety of pickle
          jsonPath: .spec.pickleType
        - name: Organic
          type: boolean
          description: Whether the pickles are organic or not
          jsonPath: .spec.isOrganic
        - name: Count
          type: integer
          description: The number of pickles
          jsonPath: .spec.count
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
 
  # either Namespaced or Cluster
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: pickles
    # singular name to be used as an alias on the CLI and for display
    singular: pickle
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: Pickle
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
      - pk

