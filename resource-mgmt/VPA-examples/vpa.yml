# Vertical Pod Autoscaling is a feature which can be added to Kubernetes. It is used for in place scaling of pod resources.
# Generally, VPA is used for scaling stateful workloads, and HPA is used for scaling stateless workloads
# For more info, see https://kubernetes.io/docs/concepts/workloads/autoscaling/vertical-pod-autoscale/
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: my-app-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"   # I am not sure why this is quoted, need to look into it
    kind: Deployment        # Or statefulset
    name: my-app
  
  updatePolicy:             # This controls how and when resource recommendations are applied
    # Note - To use InPlace mode, enable the InPlace feature gate on both the VPA updater and admission controller:
    # --feature-gates=InPlace=true
    updateMode: "InPlace"   # The avaliable modes are Off, Initial, Recreate, InPlaceOrRecreate, InPlace

  # This is an example of a resource policy. See the link above for more info.
  resourcePolicy:
    containerPolicies:
    - containerName: "application"    # I believe you can also use "*" here, but I'm not sure
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 2
        memory: 2Gi
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsAndLimits
    
